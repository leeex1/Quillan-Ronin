<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>34-Node Council Constellation Swarm | Three.js</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:#040711; overflow:hidden; width:100vw; height:100vh; font-family:sans-serif; }
    .hud { position:absolute; top:14px; left:14px; color:#00f0ff; background:rgba(4,7,17,0.85); padding:8px 14px; border-radius:6px; border:1px solid rgba(0,240,255,0.4); z-index:10; }
    .hud-title { font-size:13px; font-weight:bold; }
    .hud-sub { font-size:10px; color:#94a3b8; }
  </style>
</head>
<body>
  <div class="hud">
    <div class="hud-title">🏛️ 34-Node Council Constellation Swarm</div>
    <div class="hud-sub">34 Specialized Cognitive Nodes in dynamic Fibonacci spherical orbits with laser neural connections</div>
  </div>
  <div id="c" style="width:100%; height:100%;"></div>
  <script>
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.getElementById('c').appendChild(renderer.domElement);

    const master = new THREE.Group();
    scene.add(master);

    // Dual-Core Singularity in Center
    const coreA = new THREE.Mesh(new THREE.IcosahedronGeometry(0.9, 1), new THREE.MeshPhongMaterial({ color: 0x00f0ff, wireframe: true }));
    const coreB = new THREE.Mesh(new THREE.IcosahedronGeometry(0.7, 1), new THREE.MeshPhongMaterial({ color: 0x029e7d, wireframe: true }));
    coreA.position.x = -0.6;
    coreB.position.x = 0.6;
    master.add(coreA);
    master.add(coreB);

    // 34 Council Nodes & Synapses
    const nodeGeo = new THREE.SphereGeometry(0.12, 16, 16);
    const colors = [0x00f0ff, 0x029e7d, 0xffd700, 0xa855f7, 0xff0055];
    const nodes = [];

    for (let i = 0; i < 34; i++) {
      const col = colors[i % colors.length];
      const mesh = new THREE.Mesh(nodeGeo, new THREE.MeshBasicMaterial({ color: col }));
      const phi = Math.acos(-1 + (2 * i) / 34);
      const theta = Math.sqrt(34 * Math.PI) * phi;
      mesh.position.setFromSphericalCoords(3.8, phi, theta);
      mesh.userData = { speed: 0.3 + (i%5)*0.1, phi, theta };
      master.add(mesh);
      nodes.push(mesh);

      // Line to center
      const lineGeo = new THREE.BufferGeometry().setFromPoints([mesh.position, new THREE.Vector3(0,0,0)]);
      const line = new THREE.Line(lineGeo, new THREE.LineBasicMaterial({ color: col, transparent: true, opacity: 0.25 }));
      master.add(line);
    }

    camera.position.z = 7;
    const light = new THREE.PointLight(0x00f0ff, 2, 20);
    light.position.set(0, 5, 5);
    scene.add(light);
    scene.add(new THREE.AmbientLight(0x222233));

    function animate(t) {
      requestAnimationFrame(animate);
      const time = t * 0.001;
      master.rotation.y = time * 0.15;
      master.rotation.x = Math.sin(time * 0.1) * 0.2;
      coreA.rotation.y += 0.02;
      coreB.rotation.y -= 0.02;
      renderer.render(scene, camera);
    }
    animate(0);

    window.addEventListener('resize', () => {
      renderer.setSize(window.innerWidth, window.innerHeight);
      camera.aspect = window.innerWidth/window.innerHeight;
      camera.updateProjectionMatrix();
    });
  </script>
</body>
</html>
