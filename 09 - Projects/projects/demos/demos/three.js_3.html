<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cyberpunk Neon Skyline | Three.js</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:#02040a; overflow:hidden; width:100vw; height:100vh; font-family:sans-serif; }
    .hud { position:absolute; top:14px; left:14px; color:#00f0ff; background:rgba(4,7,17,0.85); padding:8px 14px; border-radius:6px; border:1px solid rgba(0,240,255,0.4); z-index:10; }
    .hud-title { font-size:13px; font-weight:bold; }
    .hud-sub { font-size:10px; color:#94a3b8; }
  </style>
</head>
<body>
  <div class="hud">
    <div class="hud-title">🏙️ Cyberpunk Neon Skyline of Neo-Eden</div>
    <div class="hud-sub">Procedural 3D high-rise towers with neon windows and reflective ground grid</div>
  </div>
  <div id="c" style="width:100%; height:100%;"></div>
  <script>
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x02040a, 0.04);
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.getElementById('c').appendChild(renderer.domElement);

    const city = new THREE.Group();
    scene.add(city);

    // City Buildings
    const bColors = [0x00f0ff, 0xff0055, 0x029e7d, 0xa855f7];
    for (let x = -20; x <= 20; x += 3.5) {
      for (let z = -30; z <= 10; z += 3.5) {
        if (Math.abs(x) < 2) continue; // Road
        const h = 2 + Math.random() * 9;
        const bGeo = new THREE.BoxGeometry(2.5, h, 2.5);
        const bMat = new THREE.MeshPhongMaterial({ color: 0x0a1020, wireframe: false });
        const bWireMat = new THREE.MeshBasicMaterial({ color: bColors[Math.floor(Math.random()*bColors.length)], wireframe: true, transparent: true, opacity: 0.6 });
        
        const mesh = new THREE.Mesh(bGeo, bMat);
        const wire = new THREE.Mesh(bGeo, bWireMat);
        mesh.position.set(x, h/2 - 3, z);
        wire.position.copy(mesh.position);
        city.add(mesh);
        city.add(wire);
      }
    }

    // Ground Grid
    const grid = new THREE.GridHelper(80, 80, 0x00f0ff, 0x029e7d);
    grid.position.y = -3;
    scene.add(grid);

    camera.position.set(0, 2, 12);
    camera.lookAt(0, 3, -10);

    const pLight = new THREE.PointLight(0x00f0ff, 3, 40);
    pLight.position.set(0, 10, 0);
    scene.add(pLight);
    scene.add(new THREE.AmbientLight(0x111133));

    function animate(t) {
      requestAnimationFrame(animate);
      const time = t * 0.001;
      grid.position.z = (time * 4) % 3.5 - 3.5;
      camera.position.x = Math.sin(time * 0.3) * 1.5;
      renderer.render(scene, camera);
    }
    animate(0);

    window.addEventListener('resize', () => {
      renderer.setSize(window.innerWidth, window.innerHeight);
      camera.aspect = window.innerWidth/window.innerHeight;
      camera.updateProjectionMatrix();
    });
  </script>
</body>
</html>
