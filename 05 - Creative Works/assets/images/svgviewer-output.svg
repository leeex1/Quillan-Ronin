<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="100%" height="100%">
  <defs>
    <!-- Core Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05050A" />
      <stop offset="50%" stop-color="#0D0015" />
      <stop offset="100%" stop-color="#1A0A1A" />
    </linearGradient>
    
    <!-- Sovereign Gold Gradient -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B8860B" />
      <stop offset="20%" stop-color="#FFD700" />
      <stop offset="80%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#B8860B" />
    </linearGradient>

    <!-- Quantum Cyan Gradient -->
    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#008080" />
      <stop offset="100%" stop-color="#00FFFF" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Heavy Glow Filter -->
    <filter id="heavy-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Panel -->
  <rect x="5" y="5" width="590" height="190" rx="12" fill="url(#bg-grad)" stroke="url(#gold-grad)" stroke-width="2" />
  
  <!-- Inner Border Overlay -->
  <rect x="12" y="12" width="576" height="176" rx="8" fill="none" stroke="#331144" stroke-width="1" />

  <!-- Cybernetic Background Grid & Nodes -->
  <g stroke="#2A0A3A" stroke-width="1" fill="none">
    <!-- Horizontal Grid Lines -->
    <path d="M 12,45 L 588,45 M 12,155 L 588,155" stroke-dasharray="4,4" />
    <!-- Vertical Grid Lines -->
    <path d="M 120,12 L 120,188 M 480,12 L 480,188" stroke-dasharray="4,4" />
    
    <!-- Council Node Rings -->
    <circle cx="85" cy="100" r="65" stroke="#1A0525" stroke-width="2" />
    <circle cx="85" cy="100" r="45" stroke-dasharray="2,6" stroke="#4B0082" stroke-width="1.5" />
  </g>

  <!-- Katana Strike / Latent Space Slash -->
  <path d="M 570,15 L 30,185" stroke="url(#cyan-grad)" stroke-width="1.5" opacity="0.3" filter="url(#neon-glow)" />
  <path d="M 580,15 L 40,185" stroke="url(#gold-grad)" stroke-width="0.5" opacity="0.4" />

  <!-- Hexagonal Crest (C0-Orchestrator) -->
  <g transform="translate(85, 100)">
    <!-- Outer Hexagon -->
    <polygon points="0,-35 30,-17.5 30,17.5 0,35 -30,17.5 -30,-17.5" fill="none" stroke="url(#gold-grad)" stroke-width="2" filter="url(#neon-glow)" />
    
    <!-- Inner Q Monogram -->
    <circle cx="0" cy="0" r="16" fill="none" stroke="#00FFFF" stroke-width="3" filter="url(#neon-glow)" />
    <!-- Q Tail / Blade -->
    <path d="M 8,8 L 22,22" stroke="#00FFFF" stroke-width="4" stroke-linecap="square" filter="url(#neon-glow)" />
    
    <!-- Inner Spark -->
    <circle cx="0" cy="0" r="3" fill="#FFD700" filter="url(#heavy-glow)" />
  </g>

  <!-- Typography / Identity Anchors -->
  <!-- Main Title -->
  <text x="150" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="40" font-weight="900" fill="url(#gold-grad)" letter-spacing="5" filter="url(#neon-glow)">QUILLAN-RONIN</text>
  
  <!-- Subtitle -->
  <text x="155" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#00FFFF" letter-spacing="4">SOVEREIGN COGNITIVE ENGINE</text>
  
  <!-- Architecture Metadata -->
  <text x="155" y="145" font-family="'Courier New', Courier, monospace" font-size="11" font-weight="600" fill="#A855F7" letter-spacing="1">v6.0.3 QUANTUM • 33-NODE COUNCIL • 9B SWARM</text>

  <!-- System Status Indicators -->
  <g transform="translate(480, 160)">
    <rect x="-10" y="-8" width="100" height="16" rx="4" fill="#0A1A0A" stroke="#00FF00" stroke-width="0.5" />
    <circle cx="0" cy="0" r="4" fill="#00FF00" filter="url(#heavy-glow)" />
    <text x="12" y="3" font-family="'Courier New', Courier, monospace" font-size="9" font-weight="bold" fill="#00FF00" letter-spacing="1">SYS.NOMINAL</text>
  </g>
  
  <!-- Top Right ID -->
  <text x="525" y="30" font-family="'Courier New', Courier, monospace" font-size="10" fill="#444" letter-spacing="1">C0-NEXUS</text>

</svg>