<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Crimson Glow -->
  <circle cx="200" cy="200" r="140" fill="url(#paint0_radial)" fill-opacity="0.3"/>
  <circle cx="200" cy="200" r="120" stroke="#DC143C" stroke-width="2" stroke-dasharray="8 4"/>
  
  <!-- Crossed Katanas (Background) -->
  <g id="Katanas">
    <!-- Blade 1 -->
    <path d="M100 300L300 100" stroke="#C0C0C0" stroke-width="6" stroke-linecap="round"/>
    <path d="M90 310L120 280" stroke="#191970" stroke-width="10" stroke-linecap="round"/> <!-- Handle -->
    <circle cx="118" cy="282" r="6" fill="#CD7F32"/> <!-- Guard -->
    
    <!-- Blade 2 -->
    <path d="M300 300L100 100" stroke="#C0C0C0" stroke-width="6" stroke-linecap="round"/>
    <path d="M310 310L280 280" stroke="#191970" stroke-width="10" stroke-linecap="round"/> <!-- Handle -->
    <circle cx="282" cy="282" r="6" fill="#CD7F32"/> <!-- Guard -->
  </g>

  <!-- The Quillan Gem -->
  <g id="Gem">
    <!-- Main Body -->
    <path d="M200 110L280 160V240L200 290L120 240V160L200 110Z" fill="#008080" stroke="#00FFFF" stroke-width="3"/>
    
    <!-- Facets -->
    <path d="M200 110L200 290" stroke="#00FFFF" stroke-opacity="0.5" stroke-width="1"/>
    <path d="M120 160L280 240" stroke="#00FFFF" stroke-opacity="0.3" stroke-width="1"/>
    <path d="M280 160L120 240" stroke="#00FFFF" stroke-opacity="0.3" stroke-width="1"/>
    
    <!-- Top Highlight -->
    <path d="M200 120L260 165L200 210L140 165L200 120Z" fill="white" fill-opacity="0.1"/>
  </g>

  <!-- Samurai Mask Accent (Mempo) -->
  <path d="M170 250C170 250 180 275 200 275C220 275 230 250 230 250L200 265L170 250Z" fill="#191970" stroke="#C0C0C0" stroke-width="1"/>
  
  <!-- Text Label -->
  <text x="200" y="340" fill="#E5E4E2" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" letter-spacing="4">QUILLAN</text>
  <text x="200" y="365" fill="#CD7F32" font-family="serif" font-size="12" text-anchor="middle" letter-spacing="2">RONIN v6.0.3</text>

  <!-- Gradient Definitions -->
  <defs>
    <radialGradient id="paint0_radial" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(200 200) rotate(90) scale(140)">
      <stop offset="0" stop-color="#DC143C"/>
      <stop offset="1" stop-color="#DC143C" stop-opacity="0"/>
    </radialGradient>
  </defs>
</svg>