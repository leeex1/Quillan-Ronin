<svg width="420" height="120" viewBox="0 0 420 120" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Talk to Quillan badge">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="420" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B1020"></stop>
      <stop offset="50%" stop-color="#151A33"></stop>
      <stop offset="100%" stop-color="#1E2A52"></stop>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C5CFF"></stop>
      <stop offset="50%" stop-color="#00D4FF"></stop>
      <stop offset="100%" stop-color="#7CFFB2"></stop>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"></feGaussianBlur>
      <feMerge>
        <feMergeNode in="blur"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="420" height="120" rx="24" fill="url(#bg)"></rect>

  <!-- Decorative Rings -->
  <circle cx="70" cy="60" r="34" stroke="url(#accent)" stroke-width="3" opacity="0.85"></circle>
  <circle cx="70" cy="60" r="18" stroke="url(#accent)" stroke-width="2" opacity="0.55"></circle>

  <!-- Core Orb -->
  <circle cx="70" cy="60" r="8" fill="#00D4FF" filter="url(#glow)"></circle>

  <!-- Signal Lines -->
  <path d="M96 60H118" stroke="url(#accent)" stroke-width="2" stroke-linecap="round"></path>
  <path d="M102 48H122" stroke="url(#accent)" stroke-width="1.5" opacity="0.5" stroke-linecap="round"></path>
  <path d="M102 72H122" stroke="url(#accent)" stroke-width="1.5" opacity="0.5" stroke-linecap="round"></path>

  <!-- Main Text -->
  <text x="140" y="50" fill="white" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="700">
    Talk to Quillan++
  </text>

  <!-- Subtitle -->
  <text x="140" y="78" fill="#A9B4D0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" letter-spacing="0.5">
    Council-Driven AI • Research • Code • Creativity
  </text>

  <!-- Corner Accent -->
  <path d="M380 20L400 40" stroke="url(#accent)" stroke-width="2" opacity="0.7"></path>
  <path d="M400 20L380 40" stroke="url(#accent)" stroke-width="2" opacity="0.7"></path>

  <!-- Bottom Accent Line -->
  <rect x="140" y="92" width="180" height="3" rx="2" fill="url(#accent)" opacity="0.8"></rect>
</svg>