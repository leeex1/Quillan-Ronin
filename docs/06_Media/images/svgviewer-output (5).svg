  <svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg" aria-labelledby="ronin-badge-title" role="img">
    <title id="ronin-badge-title">Quillan-Ronin Samurai Badge - CrashOverrideX</title>
    
    <!-- Outer Golden Ronin Emblem Ring -->
    <circle cx="200" cy="200" r="185" stroke="#FFD700" stroke-width="18" stroke-dasharray="12 6" opacity="0.95"/>
    <circle cx="200" cy="200" r="162" stroke="#8B0000" stroke-width="14" opacity="0.9"/>
    
    <!-- Inner Steel Ring -->
    <circle cx="200" cy="200" r="138" stroke="#2F2F2F" stroke-width="10"/>
    
    <!-- Straw Kasa (Ronin Hat) with detailed weave -->
    <ellipse cx="200" cy="138" rx="96" ry="38" fill="#1C2526" stroke="#FFD700" stroke-width="14"/>
    <path d="M120 138 Q200 92 280 138" fill="none" stroke="#FFD700" stroke-width="18" stroke-linejoin="round" opacity="0.9"/>
    <path d="M130 138 Q200 105 270 138" fill="none" stroke="#2F2F2F" stroke-width="6" opacity="0.7"/>
    
    <!-- Ronin Face / Tengai Mask -->
    <rect x="148" y="155" width="104" height="68" rx="12" ry="12" fill="#1C2526" stroke="#FFD700" stroke-width="10"/>
    
    <!-- Piercing Eyes -->
    <ellipse cx="172" cy="178" rx="9" ry="12" fill="#FFD700" transform="rotate(-8 172 178)"/>
    <ellipse cx="228" cy="178" rx="9" ry="12" fill="#FFD700" transform="rotate(8 228 178)"/>
    <circle cx="172" cy="178" r="4" fill="#1C2526"/>
    <circle cx="228" cy="178" r="4" fill="#1C2526"/>
    
    <!-- Mouth / Mask Detail -->
    <path d="M175 205 Q200 212 225 205" fill="none" stroke="#FFD700" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Haori Robe Body -->
    <path d="M140 223 Q120 280 105 340 Q140 355 200 355 Q260 355 295 340 Q280 280 260 223" fill="#2F2F2F" stroke="#FFD700" stroke-width="12"/>
    
    <!-- Sash / Obi -->
    <rect x="148" y="255" width="104" height="22" rx="4" fill="#8B0000" stroke="#FFD700" stroke-width="6"/>
    
    <!-- Katana (drawn, diagonal stance) -->
    <!-- Blade -->
    <line x1="125" y1="245" x2="285" y2="325" stroke="#C0C0C0" stroke-width="28" stroke-linecap="round" opacity="0.95"/>
    <line x1="125" y1="245" x2="285" y2="325" stroke="#FFD700" stroke-width="12" stroke-linecap="round"/>
    
    <!-- Hilt & Guard -->
    <rect x="255" y="305" width="18" height="42" rx="3" fill="#8B4513" transform="rotate(-38 265 320)"/>
    <circle cx="265" cy="312" r="14" fill="#2F2F2F" stroke="#FFD700" stroke-width="6"/>
    
    <!-- Ronin Seal - 浪 (Rōnin) -->
    <circle cx="200" cy="200" r="52" fill="none" stroke="#FFD700" stroke-width="8"/>
    <text x="200" y="218" text-anchor="middle" dominant-baseline="middle" fill="#FFD700" font-family="serif" font-size="72" font-weight="900" letter-spacing="-4">浪</text>
    
    <!-- Subtle inner glow / energy aura -->
    <circle cx="200" cy="200" r="110" fill="none" stroke="#FFD700" stroke-width="4" opacity="0.25"/>
    <circle cx="200" cy="200" r="125" fill="none" stroke="#8B0000" stroke-width="3" opacity="0.15"/>
