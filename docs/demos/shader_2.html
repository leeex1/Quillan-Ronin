<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hyper-Dimensional Quantum Vortex | Quillan GLSL Lab</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; width: 100vw; height: 100vh; font-family: -apple-system, monospace; }
    canvas { width: 100%; height: 100%; display: block; }
    .hud {
      position: absolute;
      top: 14px;
      left: 14px;
      color: #00f0ff;
      background: rgba(4, 7, 17, 0.85);
      backdrop-filter: blur(8px);
      padding: 8px 14px;
      border-radius: 6px;
      border: 1px solid rgba(0, 240, 255, 0.4);
      pointer-events: none;
      z-index: 10;
    }
    .hud-title { font-size: 13px; font-weight: bold; letter-spacing: 0.5px; }
    .hud-sub { font-size: 10px; color: #94a3b8; margin-top: 2px; }
  </style>
</head>
<body>
  <div class="hud">
    <div class="hud-title">⚡ Hyper-Dimensional Quantum Vortex</div>
    <div class="hud-sub">Relativistic plasma accretion disk around an event horizon with dynamic gravitational lensing.</div>
  </div>
  <canvas id="c"></canvas>
  <script>
    const canvas = document.getElementById('c');
    const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
    gl.getExtension('OES_standard_derivatives');

    const vs = `attribute vec2 p; varying vec2 v_texCoord; void main(){ v_texCoord = p * 0.5 + 0.5; gl_Position = vec4(p, 0.0, 1.0); }`;
    const fs = `
precision highp float;
varying vec2 v_texCoord;
uniform float u_time;
uniform vec2 u_resolution;
uniform float u_audio;

void main() {
    vec2 uv = (v_texCoord - 0.5) * 2.0;
    uv.x *= u_resolution.x / u_resolution.y;
    
    float r = length(uv);
    float theta = atan(uv.y, uv.x);
    
    // Accretion swirl
    float swirl = theta + (3.5 / (r + 0.18)) - u_time * 1.2;
    
    // Raymarched energy spirals
    float ring1 = sin(swirl * 5.0 + r * 12.0);
    float ring2 = cos(swirl * 3.0 - r * 8.0 + u_time);
    float plasma = abs(ring1 * ring2);
    
    // Relativistic beaming & Event horizon shadow
    float horizon = smoothstep(0.2, 0.28, r);
    float glow = 0.08 / (abs(r - 0.35) + 0.04);
    
    vec3 cyan = vec3(0.0, 0.96, 1.0);
    vec3 emerald = vec3(0.02, 0.7, 0.55);
    vec3 gold = vec3(1.0, 0.88, 0.15);
    
    vec3 col = mix(cyan, emerald, sin(swirl) * 0.5 + 0.5) * plasma * horizon;
    col += mix(cyan, gold, u_audio) * glow;
    col *= 1.0 - smoothstep(1.5, 2.5, r);
    
    // Film grain
    float grain = fract(sin(dot(uv, vec2(12.9898, 78.233)) * 43758.5453) * 0.03;
    col += grain * 0.5;
    
    gl_FragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
}
`;

    function compile(type, src) {
      const s = gl.createShader(type);
      gl.shaderSource(s, src);
      gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
        console.error('Shader compile error:', gl.getShaderInfoLog(s));
        const errDiv = document.createElement('div');
        errDiv.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:#ff4444;font-family:monospace;font-size:11px;white-space:pre-wrap;max-width:80vw;background:rgba(0,0,0,0.9);padding:16px;border-radius:8px;border:1px solid #ff4444;z-index:100;';
        errDiv.textContent = 'Shader compile error:\n' + gl.getShaderInfoLog(s);
        document.body.appendChild(errDiv);
        return null;
      }
      return s;
    }

    const prog = gl.createProgram();
    const vsh = compile(gl.VERTEX_SHADER, vs);
    const fsh = compile(gl.FRAGMENT_SHADER, fs);
    if (!vsh || !fsh) { console.error('Shader failed to compile'); throw new Error('Shader compile failed'); }
    gl.attachShader(prog, vsh);
    gl.attachShader(prog, fsh);
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
      console.error('Program link error:', gl.getProgramInfoLog(prog));
      throw new Error('Program link failed');
    }
    gl.useProgram(prog);

    const buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);

    const pLoc = gl.getAttribLocation(prog, 'p');
    gl.enableVertexAttribArray(pLoc);
    gl.vertexAttribPointer(pLoc, 2, gl.FLOAT, false, 0, 0);

    const uTime = gl.getUniformLocation(prog, 'u_time');
    const uRes = gl.getUniformLocation(prog, 'u_resolution');
    const uAudio = gl.getUniformLocation(prog, 'u_audio');

    let mouseX = 0.5, mouseY = 0.5;
    window.addEventListener('mousemove', (e) => {
      mouseX = e.clientX / window.innerWidth;
      mouseY = 1.0 - e.clientY / window.innerHeight;
    });

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width  = Math.floor(window.innerWidth  * dpr);
      canvas.height = Math.floor(window.innerHeight * dpr);
      gl.viewport(0, 0, canvas.width, canvas.height);
    }
    resize();
    window.addEventListener('resize', resize);

    let visible = true;
    document.addEventListener('visibilitychange', () => { visible = !document.hidden; });

    // WebGL context loss recovery
    canvas.addEventListener('webglcontextlost', (e) => { e.preventDefault(); console.warn('WebGL context lost'); });
    canvas.addEventListener('webglcontextrestored', () => { console.log('WebGL context restored'); location.reload(); });

    let t0 = performance.now();
    function render(t) {
      requestAnimationFrame(render);
      if (!visible) return;
      if (uTime)   gl.uniform1f(uTime,   (t - t0) * 0.001);
      if (uRes)    gl.uniform2f(uRes,     canvas.width, canvas.height);
      if (uAudio)  gl.uniform1f(uAudio,   0.7);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    }
    render(0);
  </script>
</body>
</html>
