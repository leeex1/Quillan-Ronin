<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GLSL 2: Hyper-Dimensional Quantum Vortex | Quillan GLSL Lab</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; width: 100vw; height: 100vh; font-family: -apple-system, monospace; }
    canvas { width: 100%; height: 100%; display: block; }
    .hud {
      position: absolute;
      top: 14px; left: 14px;
      color: #00f0ff;
      background: rgba(4, 7, 17, 0.85);
      backdrop-filter: blur(8px);
      padding: 8px 14px;
      border-radius: 6px;
      border: 1px solid rgba(0, 240, 255, 0.4);
      pointer-events: none;
      z-index: 10;
    }
    .hud-title { font-size: 13px; font-weight: bold; letter-spacing: 0.5px; }
    .hud-sub { font-size: 10px; color: #94a3b8; margin-top: 2px; }
  </style>
</head>
<body>
  <div class="hud">
    <div class="hud-title">GLSL 2: Hyper-Dimensional Quantum Vortex</div>
    <div class="hud-sub">Relativistic accretion disk with multi-layer plasma, beaming, bloom, grain.</div>
  </div>
  <canvas id="c"></canvas>
  <script>
    const canvas = document.getElementById('c');
    const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
    gl.getExtension('OES_standard_derivatives');

    const fs = `
precision highp float;
varying vec2 v_texCoord;
uniform float u_time;
uniform vec2 u_resolution;
uniform float u_audio;
uniform vec2 u_mouse;

void main() {
    vec2 uv = (v_texCoord - 0.5) * 2.0;
    uv.x *= u_resolution.x / u_resolution.y;

    float r = length(uv);
    float theta = atan(uv.y, uv.x);

    // Accretion swirl
    float swirl = theta + (3.5 / (r + 0.18)) - u_time * 1.2;

    // Multi-layer plasma
    float ring1 = sin(swirl * 5.0 + r * 12.0);
    float ring2 = cos(swirl * 3.0 - r * 8.0 + u_time);
    float ring3 = sin(swirl * 7.0 + r * 16.0 - u_time * 0.8);
    float plasma = abs(ring1 * ring2) * 0.7 + abs(ring3) * 0.3;

    // Event horizon shadow
    float horizon = smoothstep(0.15, 0.28, r);

    // Photon ring glow (dual)
    float glow = 0.06 / (abs(r - 0.32) + 0.03);
    glow += 0.03 / (abs(r - 0.55) + 0.02);
    glow = min(glow, 3.0);

    // Relativistic beaming
    float beam = 0.5 + 0.5 * cos(theta - u_time * 0.5);

    // Better color ramp
    vec3 cold  = vec3(0.02, 0.08, 0.25);
    vec3 warm  = vec3(0.0, 0.94, 1.0);
    vec3 hot   = vec3(1.0, 0.7, 0.2);
    vec3 white = vec3(1.0, 0.95, 0.85);

    vec3 col = mix(cold, warm, plasma * horizon);
    col = mix(col, hot, glow * 0.5 * beam);
    col += white * glow * beam * 0.35;

    // Disk shadow on far side
    col *= 0.65 + 0.35 * beam;

    // Outer falloff
    col *= 1.0 - smoothstep(1.2, 2.2, r);

    // Bloom: lift bright regions
    float lum = dot(col, vec3(0.299, 0.587, 0.114));
    col += col * smoothstep(0.5, 0.85, lum) * 0.35;

    // Film grain
    float grain = fract(sin(dot(uv, vec2(12.9898, 78.233)) * 43758.5453) * 0.03 - 0.015;
    col += grain;

    gl_FragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
}
`;

    function compile(type, src) {
      const s = gl.createShader(type);
      gl.shaderSource(s, src);
      gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
        console.error('Shader compile error:', gl.getShaderInfoLog(s));
        document.body.innerHTML += '<div style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:#ff4444;font-family:monospace;font-size:12px;white-space:pre-wrap;max-width:80vw;">' + gl.getShaderInfoLog(s) + '</div>';
        return null;
      }
      return s;
    }
    const vs = `attribute vec2 p; varying vec2 v_texCoord; void main(){ v_texCoord = p * 0.5 + 0.5; gl_Position = vec4(p, 0.0, 1.0); }`;
    const prog = gl.createProgram();
    const vsh = compile(gl.VERTEX_SHADER, vs);
    const fsh = compile(gl.FRAGMENT_SHADER, fs);
    if (!vsh || !fsh) { console.error('Shader failed to compile'); return; }
    gl.attachShader(prog, vsh);
    gl.attachShader(prog, fsh);
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
      console.error('Program link error:', gl.getProgramInfoLog(prog));
      return;
    }
    gl.useProgram(prog);

    const buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
    const pLoc = gl.getAttribLocation(prog, 'p');
    gl.enableVertexAttribArray(pLoc);
    gl.vertexAttribPointer(pLoc, 2, gl.FLOAT, false, 0, 0);

    const uTime = gl.getUniformLocation(prog, 'u_time');
    const uRes  = gl.getUniformLocation(prog, 'u_resolution');
    const uAudio = gl.getUniformLocation(prog, 'u_audio');
    const uMouse = gl.getUniformLocation(prog, 'u_mouse');

    let mouseX = 0.5, mouseY = 0.5;
    window.addEventListener('mousemove', (e) => {
      mouseX = e.clientX / window.innerWidth;
      mouseY = 1.0 - e.clientY / window.innerHeight;
    });

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width  = Math.floor(window.innerWidth  * dpr);
      canvas.height = Math.floor(window.innerHeight * dpr);
      gl.viewport(0, 0, canvas.width, canvas.height);
    }
    resize();
    window.addEventListener('resize', resize);

    let visible = true;
    document.addEventListener('visibilitychange', () => { visible = !document.hidden; });

    let t0 = performance.now();
    function render(t) {
      requestAnimationFrame(render);
      if (!visible) return;
      if (uTime)   gl.uniform1f(uTime,   (t - t0) * 0.001);
      if (uRes)    gl.uniform2f(uRes,     canvas.width, canvas.height);
      if (uAudio)  gl.uniform1f(uAudio,   0.7);
      if (uMouse)  gl.uniform2f(uMouse,   mouseX, mouseY);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    }
    render(0);
  </script>
</body>
</html>
