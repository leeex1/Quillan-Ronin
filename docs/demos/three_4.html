<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_62 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_62" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_62');
  const devicePixelRatio = window.devicePixelRatio || 1;
  (function() {
  const width = container.clientWidth || window.innerWidth;
  const height = container.clientHeight || window.innerHeight;
  
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
  const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
  renderer.setSize(width, height);
  renderer.setPixelRatio(window.devicePixelRatio || 1);
  container.appendChild(renderer.domElement);

  const group = new THREE.Group();
  scene.add(group);

  // The Singularity Core
  const coreGeo = new THREE.IcosahedronGeometry(1.2, 15);
  const coreMat = new THREE.MeshPhongMaterial({
    color: 0x029e7d,
    wireframe: true,
    transparent: true,
    opacity: 0.3
  });
  const core = new THREE.Mesh(coreGeo, coreMat);
  group.add(core);

  // Orbiting Expert Nodes (33)
  const nodes = [];
  const expertCount = 33;
  const nodeGeo = new THREE.SphereGeometry(0.08, 16, 16);
  const nodeMat = new THREE.MeshBasicMaterial({ color: 0x80f8d2 });

  for (let i = 0; i < expertCount; i++) {
    const node = new THREE.Mesh(nodeGeo, nodeMat);
    const phi = Math.acos(-1 + (2 * i) / expertCount);
    const theta = Math.sqrt(expertCount * Math.PI) * phi;
    node.position.setFromSphericalCoords(2.5, phi, theta);
    node.userData = { 
      originalPos: node.position.clone(),
      phi: phi,
      theta: theta,
      speed: 0.2 + Math.random() * 0.5
    };
    group.add(node);
    nodes.push(node);
  }

  // Neural Filaments (connections)
  const lineMat = new THREE.LineBasicMaterial({ color: 0x029e7d, transparent: true, opacity: 0.1 });
  for (let i = 0; i < nodes.length; i++) {
    for (let j = i + 1; j < nodes.length; j++) {
      if (nodes[i].position.distanceTo(nodes[j].position) < 1.5) {
        const points = [nodes[i].position, nodes[j].position];
        const lineGeo = new THREE.BufferGeometry().setFromPoints(points);
        const line = new THREE.Line(lineGeo, lineMat);
        group.add(line);
      }
    }
  }

  const light = new THREE.PointLight(0x029e7d, 2, 20);
  light.position.set(5, 5, 5);
  scene.add(light);
  scene.add(new THREE.AmbientLight(0x111111));

  camera.position.z = 6;

  function animate(t) {
    requestAnimationFrame(animate);
    const time = t * 0.001;
    
    group.rotation.y += 0.002;
    group.rotation.x += 0.001;
    
    core.scale.setScalar(1 + Math.sin(time * 2) * 0.1);
    core.rotation.z -= 0.005;

    nodes.forEach(node => {
      const offset = Math.sin(time * node.userData.speed) * 0.2;
      node.position.copy(node.userData.originalPos).multiplyScalar(1 + offset);
    });
    
    renderer.render(scene, camera);
  }

  window.addEventListener('resize', () => {
    const w = container.clientWidth || window.innerWidth;
    const h = container.clientHeight || window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
  });

  animate(0);
})();
})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_62 -->
</body></html>
