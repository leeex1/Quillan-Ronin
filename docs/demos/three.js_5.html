<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Quantum Core Energy Singularity | Three.js</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:#040711; overflow:hidden; width:100vw; height:100vh; font-family:sans-serif; }
    .hud { position:absolute; top:14px; left:14px; color:#00f0ff; background:rgba(4,7,17,0.85); padding:8px 14px; border-radius:6px; border:1px solid rgba(0,240,255,0.4); z-index:10; }
    .hud-title { font-size:13px; font-weight:bold; }
    .hud-sub { font-size:10px; color:#94a3b8; }
  </style>
</head>
<body>
  <div class="hud">
    <div class="hud-title">⚡ Quantum Core Energy Singularity</div>
    <div class="hud-sub">Dual-axis gimbal gyroscope containment rings revolving around a pulsating plasma core</div>
  </div>
  <div id="c" style="width:100%; height:100%;"></div>
  <script>
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.getElementById('c').appendChild(renderer.domElement);

    const group = new THREE.Group();
    scene.add(group);

    // Inner Core Plasma
    const core = new THREE.Mesh(new THREE.IcosahedronGeometry(1.2, 2), new THREE.MeshBasicMaterial({ color: 0x00f0ff, wireframe: true }));
    group.add(core);

    // Gimbal Ring 1
    const ring1 = new THREE.Mesh(new THREE.TorusGeometry(2.2, 0.06, 8, 64), new THREE.MeshPhongMaterial({ color: 0x029e7d, wireframe: false }));
    group.add(ring1);

    // Gimbal Ring 2
    const ring2 = new THREE.Mesh(new THREE.TorusGeometry(2.8, 0.06, 8, 64), new THREE.MeshPhongMaterial({ color: 0xffd700, wireframe: false }));
    group.add(ring2);

    // Magnetic particles
    const pGeo = new THREE.BufferGeometry();
    const pPos = new Float32Array(1200 * 3);
    for (let i = 0; i < 1200; i++) {
      const r = 1.4 + Math.random() * 2.2;
      const th = Math.random() * Math.PI * 2;
      const ph = Math.acos(2 * Math.random() - 1);
      pPos[i*3] = r * Math.sin(ph) * Math.cos(th);
      pPos[i*3+1] = r * Math.sin(ph) * Math.sin(th);
      pPos[i*3+2] = r * Math.cos(ph);
    }
    pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
    const parts = new THREE.Points(pGeo, new THREE.PointsMaterial({ color: 0x00f0ff, size: 0.035 }));
    group.add(parts);

    camera.position.z = 6.5;
    const light = new THREE.PointLight(0x00f0ff, 3, 20);
    light.position.set(3, 4, 5);
    scene.add(light);

    function animate(t) {
      requestAnimationFrame(animate);
      const time = t * 0.001;
      ring1.rotation.x = time * 0.8;
      ring1.rotation.y = time * 0.5;
      ring2.rotation.y = -time * 0.6;
      ring2.rotation.z = time * 0.4;
      core.rotation.y = time * 1.2;
      parts.rotation.z = -time * 0.2;
      renderer.render(scene, camera);
    }
    animate(0);

    window.addEventListener('resize', () => {
      renderer.setSize(window.innerWidth, window.innerHeight);
      camera.aspect = window.innerWidth/window.innerHeight;
      camera.updateProjectionMatrix();
    });
  </script>
</body>
</html>
