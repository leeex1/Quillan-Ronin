<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GLSL 7: 4D Quaternion Fractal Dimension Warp | Quillan GLSL Lab</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; width: 100vw; height: 100vh; font-family: -apple-system, monospace; }
    canvas { width: 100%; height: 100%; display: block; }
    .hud {
      position: absolute;
      top: 14px; left: 14px;
      color: #00f0ff;
      background: rgba(4, 7, 17, 0.85);
      backdrop-filter: blur(8px);
      padding: 8px 14px;
      border-radius: 6px;
      border: 1px solid rgba(0, 240, 255, 0.4);
      pointer-events: none;
      z-index: 10;
    }
    .hud-title { font-size: 13px; font-weight: bold; letter-spacing: 0.5px; }
    .hud-sub { font-size: 10px; color: #94a3b8; margin-top: 2px; }
  </style>
</head>
<body>
  <div class="hud">
    <div class="hud-title">GLSL 7: 4D Quaternion Fractal Dimension Warp</div>
    <div class="hud-sub">64-iteration Julia with smooth coloring, orbit trap, specular, bloom, grain.</div>
  </div>
  <canvas id="c"></canvas>
  <script>
    const canvas = document.getElementById('c');
    const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
    gl.getExtension('OES_standard_derivatives');

    const fs = `
precision highp float;
varying vec2 v_texCoord;
uniform float u_time;
uniform vec2 u_resolution;
uniform float u_audio;
uniform vec2 u_mouse;

void main() {
    vec2 uv = (v_texCoord - 0.5) * 2.5;
    uv.x *= u_resolution.x / u_resolution.y;

    vec2 z = uv;
    vec2 c = vec2(sin(u_time * 0.2) * 0.5, cos(u_time * 0.15) * 0.5);

    float n = 0.0;
    for (int i = 0; i < 64; i++) {
        if (dot(z, z) > 4.0) break;
        z = vec2(z.x * z.x - z.y * z.y, 2.0 * z.x * z.y) + c;
        n += 1.0;
    }

    // smooth coloring (continuous iteration count)
    float smooth_n = n;
    if (dot(z, z) > 4.0) {
        float log_zn = log(length(z));
        float nu = log(log_zn / log(2.0)) / log(2.0);
        nu = clamp(nu, 0.0, 2.0);
        smooth_n = n + 1.0 - nu;
    }
    float iter = smooth_n / 64.0;

    vec3 cyan    = vec3(0.0, 0.94, 1.0);
    vec3 emerald = vec3(0.01, 0.62, 0.49);
    vec3 purple  = vec3(0.66, 0.33, 0.97);
    vec3 gold    = vec3(1.0, 0.84, 0.0);

    // orbit trap coloring
    float trap = length(z) * 0.3;
    vec3 col = mix(cyan, emerald, sin(iter * 6.28 + u_time) * 0.5 + 0.5) * iter * 2.0;
    col += purple * (1.0 - iter) * 0.25;
    col += gold * smoothstep(0.0, 0.3, trap) * 0.15;

    // specular on boundary
    float boundary = smoothstep(0.85, 0.95, iter) * (1.0 - smoothstep(0.95, 1.0, iter));
    col += vec3(1.0) * boundary * 0.4;

    // vignette
    col *= 1.0 - length(v_texCoord - 0.5) * 0.6;

    // bloom
    float lum = dot(col, vec3(0.299, 0.587, 0.114));
    col += col * smoothstep(0.5, 0.9, lum) * 0.3;

    // film grain
    float grain = fract(sin(dot(v_texCoord, vec2(12.9898, 78.233)) * 43758.5453) * 0.03 - 0.015;
    col += grain;

    gl_FragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
}
`;

    function compile(type, src) {
      const s = gl.createShader(type);
      gl.shaderSource(s, src);
      gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
        console.error('Shader compile error:', gl.getShaderInfoLog(s));
        document.body.innerHTML += '<div style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:#ff4444;font-family:monospace;font-size:12px;white-space:pre-wrap;max-width:80vw;">' + gl.getShaderInfoLog(s) + '</div>';
        return null;
      }
      return s;
    }
    const vs = `attribute vec2 p; varying vec2 v_texCoord; void main(){ v_texCoord = p * 0.5 + 0.5; gl_Position = vec4(p, 0.0, 1.0); }`;
    const prog = gl.createProgram();
    const vsh = compile(gl.VERTEX_SHADER, vs);
    const fsh = compile(gl.FRAGMENT_SHADER, fs);
    if (!vsh || !fsh) { console.error('Shader failed to compile'); return; }
    gl.attachShader(prog, vsh);
    gl.attachShader(prog, fsh);
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
      console.error('Program link error:', gl.getProgramInfoLog(prog));
      return;
    }
    gl.useProgram(prog);

    const buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
    const pLoc = gl.getAttribLocation(prog, 'p');
    gl.enableVertexAttribArray(pLoc);
    gl.vertexAttribPointer(pLoc, 2, gl.FLOAT, false, 0, 0);

    const uTime = gl.getUniformLocation(prog, 'u_time');
    const uRes  = gl.getUniformLocation(prog, 'u_resolution');
    const uAudio = gl.getUniformLocation(prog, 'u_audio');
    const uMouse = gl.getUniformLocation(prog, 'u_mouse');

    let mouseX = 0.5, mouseY = 0.5;
    window.addEventListener('mousemove', (e) => {
      mouseX = e.clientX / window.innerWidth;
      mouseY = 1.0 - e.clientY / window.innerHeight;
    });

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width  = Math.floor(window.innerWidth  * dpr);
      canvas.height = Math.floor(window.innerHeight * dpr);
      gl.viewport(0, 0, canvas.width, canvas.height);
    }
    resize();
    window.addEventListener('resize', resize);

    let visible = true;
    document.addEventListener('visibilitychange', () => { visible = !document.hidden; });

    let t0 = performance.now();
    function render(t) {
      requestAnimationFrame(render);
      if (!visible) return;
      if (uTime)   gl.uniform1f(uTime,   (t - t0) * 0.001);
      if (uRes)    gl.uniform2f(uRes,     canvas.width, canvas.height);
      if (uAudio)  gl.uniform1f(uAudio,   0.7);
      if (uMouse)  gl.uniform2f(uMouse,   mouseX, mouseY);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    }
    render(0);
  </script>
</body>
</html>
