<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_54 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_54" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_54');
  const devicePixelRatio = window.devicePixelRatio || 1;
  (function() {
  const container = document.getElementById('threejs-container-ANIMATION_N') || container;
  const width = container.clientWidth || window.innerWidth;
  const height = container.clientHeight || window.innerHeight;
  
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
  const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
  renderer.setSize(width, height);
  renderer.setPixelRatio(window.devicePixelRatio || 1);
  container.appendChild(renderer.domElement);

  // The 33-Expert Master Loom
  const masterGroup = new THREE.Group();
  scene.add(masterGroup);

  const expertCount = 33;
  const radius = 2.8;
  const nodeGeom = new THREE.IcosahedronGeometry(0.15, 1);
  const nodeMat = new THREE.MeshPhongMaterial({ 
    color: 0x029e7d, 
    emissive: 0x029e7d, 
    emissiveIntensity: 1.2,
    transparent: true,
    opacity: 0.95
  });

  const nodes = [];
  for (let i = 0; i < expertCount; i++) {
    const phi = Math.acos(-1 + (2 * i) / expertCount);
    const theta = Math.sqrt(expertCount * Math.PI) * phi;
    
    const node = new THREE.Mesh(nodeGeom, nodeMat);
    node.position.setFromSphericalCoords(radius, phi, theta);
    node.userData = { originalPos: node.position.clone(), offset: Math.random() * 100 };
    masterGroup.add(node);
    nodes.push(node);
  }

  // Double-Helix Logic Strands
  const lineMat = new THREE.LineBasicMaterial({ 
    color: 0x029e7d, 
    transparent: true, 
    opacity: 0.25 
  });
  
  for (let i = 0; i < nodes.length; i++) {
    for (let j = i + 1; j < nodes.length; j++) {
        if (nodes[i].position.distanceTo(nodes[j].position) < 1.8) {
            const geometry = new THREE.BufferGeometry().setFromPoints([nodes[i].position, nodes[j].position]);
            const line = new THREE.Line(geometry, lineMat);
            masterGroup.add(line);
        }
    }
  }

  // Central Subjective Core (Crystalline)
  const coreGeom = new THREE.OctahedronGeometry(1.2, 3);
  const coreMat = new THREE.MeshPhongMaterial({
    color: 0x029e7d,
    wireframe: true,
    transparent: true,
    opacity: 0.4
  });
  const core = new THREE.Mesh(coreGeom, coreMat);
  masterGroup.add(core);

  const innerCore = new THREE.Mesh(
    new THREE.SphereGeometry(0.6, 32, 32),
    new THREE.MeshBasicMaterial({ color: 0x029e7d, transparent: true, opacity: 0.2 })
  );
  masterGroup.add(innerCore);

  const light = new THREE.PointLight(0x029e7d, 2.5, 20);
  light.position.set(5, 5, 5);
  scene.add(light);
  scene.add(new THREE.AmbientLight(0x222222));

  camera.position.z = 6.5;

  function animate(t) {
    requestAnimationFrame(animate);
    const time = t * 0.001;
    
    masterGroup.rotation.y += 0.0025;
    masterGroup.rotation.z += 0.0015;
    
    nodes.forEach(node => {
        const noise = Math.sin(time * 1.5 + node.userData.offset) * 0.15;
        node.position.copy(node.userData.originalPos).multiplyScalar(1 + noise);
        node.rotation.y += 0.01;
    });

    core.rotation.y -= 0.006;
    core.rotation.x += 0.004;
    innerCore.scale.setScalar(1 + Math.sin(time * 2.5) * 0.15);
    
    renderer.render(scene, camera);
  }

  window.addEventListener('resize', () => {
    const w = container.clientWidth || window.innerWidth;
    const h = container.clientHeight || window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
  });

  animate(0);
})();
})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_54 -->
</body></html>
