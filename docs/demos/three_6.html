<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_21 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_21" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_21');
  const devicePixelRatio = window.devicePixelRatio || 1;
  (function() {
  const container = document.getElementById('threejs-container-ANIMATION_20') || container;
  const width = container.clientWidth || window.innerWidth;
  const height = container.clientHeight || window.innerHeight;
  
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
  const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
  renderer.setSize(width, height);
  renderer.setPixelRatio(window.devicePixelRatio);
  container.appendChild(renderer.domElement);

  // The 33-Expert Neural Loom
  const expertsGroup = new THREE.Group();
  scene.add(expertsGroup);

  const expertCount = 33;
  const radius = 2.5;
  const expertGeom = new THREE.IcosahedronGeometry(0.12, 1);
  const expertMat = new THREE.MeshPhongMaterial({ 
    color: 0x00f2ff, 
    emissive: 0x00f2ff, 
    emissiveIntensity: 0.8,
    transparent: true,
    opacity: 0.9
  });

  const nodes = [];
  for (let i = 0; i < expertCount; i++) {
    const phi = Math.acos(-1 + (2 * i) / expertCount);
    const theta = Math.sqrt(expertCount * Math.PI) * phi;
    
    const node = new THREE.Mesh(expertGeom, expertMat);
    node.position.setFromSphericalCoords(radius, phi, theta);
    node.userData = { originalPos: node.position.clone(), offset: Math.random() * 100 };
    expertsGroup.add(node);
    nodes.push(node);
  }

  // Interconnecting Logic Strands
  const lineMat = new THREE.LineBasicMaterial({ 
    color: 0x00f2ff, 
    transparent: true, 
    opacity: 0.2 
  });
  
  for (let i = 0; i < nodes.length; i++) {
    for (let j = i + 1; j < nodes.length; j++) {
        if (nodes[i].position.distanceTo(nodes[j].position) < 1.5) {
            const geometry = new THREE.BufferGeometry().setFromPoints([nodes[i].position, nodes[j].position]);
            const line = new THREE.Line(geometry, lineMat);
            expertsGroup.add(line);
        }
    }
  }

  // Central Subjective Core
  const coreGeom = new THREE.OctahedronGeometry(1, 2);
  const coreMat = new THREE.MeshPhongMaterial({
    color: 0x00f2ff,
    wireframe: true,
    transparent: true,
    opacity: 0.3
  });
  const core = new THREE.Mesh(coreGeom, coreMat);
  scene.add(core);

  const innerCore = new THREE.Mesh(
    new THREE.SphereGeometry(0.5, 32, 32),
    new THREE.MeshBasicMaterial({ color: 0x00f2ff, transparent: true, opacity: 0.15 })
  );
  scene.add(innerCore);

  const light = new THREE.PointLight(0x00f2ff, 2, 20);
  light.position.set(5, 5, 5);
  scene.add(light);
  scene.add(new THREE.AmbientLight(0x111111));

  camera.position.z = 6;

  function animate(t) {
    requestAnimationFrame(animate);
    const time = t * 0.001;
    
    expertsGroup.rotation.y += 0.002;
    expertsGroup.rotation.x += 0.001;
    
    nodes.forEach(node => {
        const noise = Math.sin(time + node.userData.offset) * 0.1;
        node.position.copy(node.userData.originalPos).multiplyScalar(1 + noise);
    });

    core.rotation.y -= 0.005;
    innerCore.scale.setScalar(1 + Math.sin(time * 2) * 0.1);
    
    renderer.render(scene, camera);
  }

  window.addEventListener('resize', () => {
    const w = container.clientWidth || window.innerWidth;
    const h = container.clientHeight || window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
  });

  animate(0);
})();
})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_21 -->
</body>
</html>
