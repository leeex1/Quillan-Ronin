<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cybernetic Hologram & Chromatic Glitch | Quillan GLSL Lab</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; width: 100vw; height: 100vh; font-family: -apple-system, monospace; }
    canvas { width: 100%; height: 100%; display: block; }
    .hud {
      position: absolute;
      top: 14px;
      left: 14px;
      color: #00f0ff;
      background: rgba(4, 7, 17, 0.85);
      backdrop-filter: blur(8px);
      padding: 8px 14px;
      border-radius: 6px;
      border: 1px solid rgba(0, 240, 255, 0.4);
      pointer-events: none;
      z-index: 10;
    }
    .hud-title { font-size: 13px; font-weight: bold; letter-spacing: 0.5px; }
    .hud-sub { font-size: 10px; color: #94a3b8; margin-top: 2px; }
  </style>
</head>
<body>
  <div class="hud">
    <div class="hud-title">⚡ Cybernetic Hologram & Chromatic Glitch</div>
    <div class="hud-sub">RGB chromatic aberration displacement with digital noise scanlines and holographic pulse.</div>
  </div>
  <canvas id="c"></canvas>
  <script>
    const canvas = document.getElementById('c');
    const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
    gl.getExtension('OES_standard_derivatives');

    const vs = `attribute vec2 p; varying vec2 v_texCoord; void main(){ v_texCoord = p * 0.5 + 0.5; gl_Position = vec4(p, 0.0, 1.0); }`;
    const fs = `
precision highp float;
varying vec2 v_texCoord;
uniform float u_time;
uniform vec2 u_resolution;
uniform float u_audio;

float noise(vec2 p) {
    return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453);
}

void main() {
    vec2 uv = v_texCoord;
    
    // Chromatic glitch offset
    float glitch = step(0.96, sin(u_time * 8.0 + uv.y * 30.0)) * 0.03;
    glitch += step(0.98, noise(vec2(u_time * 5.0, floor(uv.y * 40.0)))) * 0.05;
    
    vec2 uvR = uv + vec2(glitch * 1.5, 0.0);
    vec2 uvG = uv;
    vec2 uvB = uv - vec2(glitch * 1.5, 0.0);
    
    // Plasma waves
    float pR = sin(uvR.x * 10.0 + u_time) + cos(uvR.y * 12.0 - u_time * 1.2);
    float pG = sin(uvG.x * 12.0 - u_time * 1.1) + cos(uvG.y * 8.0 + u_time * 1.3);
    float pB = sin(uvB.x * 8.0 + u_time * 1.4) + cos(uvB.y * 14.0 - u_time * 0.9);
    
    vec3 col;
    col.r = sin(pR * 2.0) * 0.5 + 0.5;
    col.g = (sin(pG * 2.0) * 0.5 + 0.5) * 0.9 + 0.1;
    col.b = (sin(pB * 2.0) * 0.5 + 0.5) * 1.2;
    
    col *= vec3(0.0, 0.94, 1.0) * 1.2;
    
    // Hologram Scanlines
    col *= 0.8 + 0.2 * sin(uv.y * u_resolution.y * 2.0);
    col *= 1.0 - length(uv - 0.5) * 0.7;

    // Film grain
    float grain = noise(uv * u_resolution + u_time * 100.0) * 0.04;
    col += grain * 0.5;
    
    gl_FragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
}
`;

    function compile(type, src) {
      const s = gl.createShader(type);
      gl.shaderSource(s, src);
      gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
        console.error('Shader compile error:', gl.getShaderInfoLog(s));
        const errDiv = document.createElement('div');
        errDiv.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:#ff4444;font-family:monospace;font-size:11px;white-space:pre-wrap;max-width:80vw;background:rgba(0,0,0,0.9);padding:16px;border-radius:8px;border:1px solid #ff4444;z-index:100;';
        errDiv.textContent = 'Shader compile error:\n' + gl.getShaderInfoLog(s);
        document.body.appendChild(errDiv);
        return null;
      }
      return s;
    }

    const prog = gl.createProgram();
    const vsh = compile(gl.VERTEX_SHADER, vs);
    const fsh = compile(gl.FRAGMENT_SHADER, fs);
    if (!vsh || !fsh) { console.error('Shader failed to compile'); throw new Error('Shader compile failed'); }
    gl.attachShader(prog, vsh);
    gl.attachShader(prog, fsh);
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
      console.error('Program link error:', gl.getProgramInfoLog(prog));
      throw new Error('Program link failed');
    }
    gl.useProgram(prog);

    const buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);

    const pLoc = gl.getAttribLocation(prog, 'p');
    gl.enableVertexAttribArray(pLoc);
    gl.vertexAttribPointer(pLoc, 2, gl.FLOAT, false, 0, 0);

    const uTime = gl.getUniformLocation(prog, 'u_time');
    const uRes = gl.getUniformLocation(prog, 'u_resolution');
    const uAudio = gl.getUniformLocation(prog, 'u_audio');

    let mouseX = 0.5, mouseY = 0.5;
    window.addEventListener('mousemove', (e) => {
      mouseX = e.clientX / window.innerWidth;
      mouseY = 1.0 - e.clientY / window.innerHeight;
    });

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width  = Math.floor(window.innerWidth  * dpr);
      canvas.height = Math.floor(window.innerHeight * dpr);
      gl.viewport(0, 0, canvas.width, canvas.height);
    }
    resize();
    window.addEventListener('resize', resize);

    let visible = true;
    document.addEventListener('visibilitychange', () => { visible = !document.hidden; });

    // WebGL context loss recovery
    canvas.addEventListener('webglcontextlost', (e) => { e.preventDefault(); console.warn('WebGL context lost'); });
    canvas.addEventListener('webglcontextrestored', () => { console.log('WebGL context restored'); location.reload(); });

    let t0 = performance.now();
    function render(t) {
      requestAnimationFrame(render);
      if (!visible) return;
      if (uTime)   gl.uniform1f(uTime,   (t - t0) * 0.001);
      if (uRes)    gl.uniform2f(uRes,     canvas.width, canvas.height);
      if (uAudio)  gl.uniform1f(uAudio,   0.7);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    }
    render(0);
  </script>
</body>
</html>
