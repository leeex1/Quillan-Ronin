<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Neural Manifold Torus Knot | Three.js</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:#040711; overflow:hidden; width:100vw; height:100vh; font-family:sans-serif; }
    .hud { position:absolute; top:14px; left:14px; color:#00f0ff; background:rgba(4,7,17,0.85); padding:8px 14px; border-radius:6px; border:1px solid rgba(0,240,255,0.4); z-index:10; }
    .hud-title { font-size:13px; font-weight:bold; }
    .hud-sub { font-size:10px; color:#94a3b8; }
  </style>
</head>
<body>
  <div class="hud">
    <div class="hud-title">🧠 Neural Manifold Torus Knot</div>
    <div class="hud-sub">Parametric (2,3) Torus Knot with glowing multi-layer wireframe & orbital synapse particles</div>
  </div>
  <div id="c" style="width:100%; height:100%;"></div>
  <script>
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.getElementById('c').appendChild(renderer.domElement);

    const group = new THREE.Group();
    scene.add(group);

    // Torus Knot Wireframe
    const geo = new THREE.TorusKnotGeometry(2.0, 0.5, 160, 32, 2, 3);
    const matWire = new THREE.MeshPhongMaterial({ color: 0x00f0ff, wireframe: true, transparent: true, opacity: 0.8 });
    const knotWire = new THREE.Mesh(geo, matWire);
    group.add(knotWire);

    // Inner glowing solid
    const matSolid = new THREE.MeshPhongMaterial({ color: 0x029e7d, emissive: 0x003322, transparent: true, opacity: 0.5, shininess: 80 });
    const knotSolid = new THREE.Mesh(geo, matSolid);
    knotSolid.scale.set(0.96, 0.96, 0.96);
    group.add(knotSolid);

    // Orbiting Synapse Particles
    const partGeo = new THREE.BufferGeometry();
    const partPos = new Float32Array(800 * 3);
    for(let i=0; i<800; i++) {
      partPos[i*3] = (Math.random()-0.5)*8;
      partPos[i*3+1] = (Math.random()-0.5)*8;
      partPos[i*3+2] = (Math.random()-0.5)*8;
    }
    partGeo.setAttribute('position', new THREE.BufferAttribute(partPos, 3));
    const partMat = new THREE.PointsMaterial({ color: 0xffd700, size: 0.05, transparent: true, opacity: 0.7 });
    const parts = new THREE.Points(partGeo, partMat);
    group.add(parts);

    const light1 = new THREE.PointLight(0x00f0ff, 2.5, 20);
    light1.position.set(4, 4, 4);
    scene.add(light1);

    const light2 = new THREE.PointLight(0xff0055, 2.0, 20);
    light2.position.set(-4, -4, 4);
    scene.add(light2);
    scene.add(new THREE.AmbientLight(0x111122));

    camera.position.z = 6.5;

    function animate(t) {
      requestAnimationFrame(animate);
      const time = t * 0.001;
      group.rotation.x = time * 0.4;
      group.rotation.y = time * 0.6;
      parts.rotation.z = time * 0.1;
      renderer.render(scene, camera);
    }
    animate(0);

    window.addEventListener('resize', () => {
      renderer.setSize(window.innerWidth, window.innerHeight);
      camera.aspect = window.innerWidth/window.innerHeight;
      camera.updateProjectionMatrix();
    });
  </script>
</body>
</html>
