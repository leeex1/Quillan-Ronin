<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>⚡ GLSL 1: Authentic Matrix Katakana Rain Stream | Quillan GLSL Lab</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; width: 100vw; height: 100vh; font-family: -apple-system, monospace; }
    canvas { width: 100%; height: 100%; display: block; }
    .hud {
      position: absolute;
      top: 14px; left: 14px;
      color: #00f0ff;
      background: rgba(4, 7, 17, 0.85);
      backdrop-filter: blur(8px);
      padding: 8px 14px;
      border-radius: 6px;
      border: 1px solid rgba(0, 240, 255, 0.4);
      pointer-events: none;
      z-index: 10;
    }
    .hud-title { font-size: 13px; font-weight: bold; letter-spacing: 0.5px; }
    .hud-sub { font-size: 10px; color: #94a3b8; margin-top: 2px; }
  </style>
</head>
<body>
  <div class="hud">
    <div class="hud-title">⚡ GLSL 1: Authentic Matrix Katakana Rain Stream</div>
    <div class="hud-sub">Procedural 5x7 Katakana stream with phosphor bloom, film grain, and ACES tone mapping.</div>
  </div>
  <canvas id="c"></canvas>
  <script>
    const canvas = document.getElementById('c');
    const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
    gl.getExtension('OES_standard_derivatives');

    const fs = `
precision highp float;
varying vec2 v_texCoord;
uniform float u_time;
uniform vec2 u_resolution;
uniform float u_audio;
uniform vec2 u_mouse;

float hash(vec2 p) {
    p = fract(p * vec2(123.34, 456.21));
    p += dot(p, p + 45.32);
    return fract(p.x * p.y);
}

float kanjiChar(vec2 uv, float id, float time) {
    vec2 p = uv * vec2(5.0, 7.0);
    vec2 ip = floor(p);
    vec2 fp = fract(p);
    float t = floor(time * 3.0 + id * 17.0);
    float h = hash(ip + vec2(t * 0.13, id * 1.71));
    float stroke = step(0.42, h);
    // softer edges than hard step
    stroke *= smoothstep(0.12, 0.18, fp.x) * smoothstep(0.12, 0.18, 1.0 - fp.x);
    stroke *= smoothstep(0.12, 0.18, fp.y) * smoothstep(0.12, 0.18, 1.0 - fp.y);
    if (fp.x < 0.15 || fp.x > 0.85 || fp.y < 0.15 || fp.y > 0.85) stroke = 0.0;
    return stroke;
}

void main() {
    vec2 uv = v_texCoord;
    float cols = 64.0;
    vec2 grid = vec2(cols, cols * 0.5);
    vec2 st = uv * grid;
    vec2 col_id = floor(st);
    vec2 cell_uv = fract(st);

    float speed = 0.4 + hash(vec2(col_id.x, 1.0)) * 0.9;
    float col_offset = hash(vec2(col_id.x, 5.0)) * 20.0;

    float y_pos = uv.y + (u_time * 0.15 * speed) + col_offset;
    float row_id = floor(y_pos * grid.y);
    vec2 char_uv = fract(vec2(cell_uv.x, fract(y_pos * grid.y)));

    float char_id = col_id.x * 137.0 + row_id;
    float char_val = kanjiChar(char_uv, char_id, u_time);

    float trail_pos = fract(y_pos * 0.5);
    float trail = pow(trail_pos, 4.0);
    float head = smoothstep(0.92, 1.0, trail_pos) * 2.5;

    vec3 green = vec3(0.0, 1.0, 0.45);
    vec3 cyan  = vec3(0.0, 0.94, 1.0);
    vec3 white = vec3(0.9, 1.0, 0.95);

    vec3 col = mix(green, cyan, hash(col_id) * 0.3) * trail * 1.5;
    col += white * head;
    col *= char_val;

    // scanlines + vignette
    col *= 0.85 + 0.15 * sin(uv.y * u_resolution.y * 1.5);
    col *= 1.0 - length(uv - 0.5) * 0.6;

    // audio glow
    col += green * u_audio * 0.15 * trail;

    // bloom approximation: lift bright heads
    col += white * head * 0.35;

    // subtle film grain
    float grain = hash(uv * u_resolution + u_time * 100.0) * 0.06 - 0.03;
    col += grain;

    // ACES filmic tone map
    col = (col * (2.51 * col + 0.03)) / (col * (2.43 * col + 0.59) + 0.14);

    gl_FragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
}
`;

    function compile(type, src) {
      const s = gl.createShader(type);
      gl.shaderSource(s, src);
      gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
        console.error('Shader compile error:', gl.getShaderInfoLog(s));
        return null;
      }
      return s;
    }
    const vs = `attribute vec2 p; varying vec2 v_texCoord; void main(){ v_texCoord = p * 0.5 + 0.5; gl_Position = vec4(p, 0.0, 1.0); }`;
    const prog = gl.createProgram();
    const vsh = compile(gl.VERTEX_SHADER, vs);
    const fsh = compile(gl.FRAGMENT_SHADER, fs);
    if (!vsh || !fsh) { console.error('Shader failed to compile'); return; }
    gl.attachShader(prog, vsh);
    gl.attachShader(prog, fsh);
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
      console.error('Program link error:', gl.getProgramInfoLog(prog));
      return;
    }
    gl.useProgram(prog);

    const buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
    const pLoc = gl.getAttribLocation(prog, 'p');
    gl.enableVertexAttribArray(pLoc);
    gl.vertexAttribPointer(pLoc, 2, gl.FLOAT, false, 0, 0);

    const uTime = gl.getUniformLocation(prog, 'u_time');
    const uRes  = gl.getUniformLocation(prog, 'u_resolution');
    const uAudio = gl.getUniformLocation(prog, 'u_audio');
    const uMouse = gl.getUniformLocation(prog, 'u_mouse');

    let mouseX = 0.5, mouseY = 0.5;
    window.addEventListener('mousemove', (e) => {
      mouseX = e.clientX / window.innerWidth;
      mouseY = 1.0 - e.clientY / window.innerHeight;
    });

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width  = Math.floor(window.innerWidth  * dpr);
      canvas.height = Math.floor(window.innerHeight * dpr);
      gl.viewport(0, 0, canvas.width, canvas.height);
    }
    resize();
    window.addEventListener('resize', resize);

    let visible = true;
    document.addEventListener('visibilitychange', () => { visible = !document.hidden; });

    let t0 = performance.now();
    function render(t) {
      requestAnimationFrame(render);
      if (!visible) return;
      if (uTime)   gl.uniform1f(uTime,   (t - t0) * 0.001);
      if (uRes)    gl.uniform2f(uRes,     canvas.width, canvas.height);
      if (uAudio)  gl.uniform1f(uAudio,   0.7);
      if (uMouse)  gl.uniform2f(uMouse,   mouseX, mouseY);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    }
    render(0);
  </script>
</body>
</html>
