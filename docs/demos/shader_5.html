<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>🌊 GLSL 5: Thermodynamic Quantum Fluid Swarm | Quillan GLSL Lab</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; width: 100vw; height: 100vh; font-family: -apple-system, monospace; }
    canvas { width: 100%; height: 100%; display: block; }
    .hud {
      position: absolute;
      top: 14px; left: 14px;
      color: #00f0ff;
      background: rgba(4, 7, 17, 0.85);
      backdrop-filter: blur(8px);
      padding: 8px 14px;
      border-radius: 6px;
      border: 1px solid rgba(0, 240, 255, 0.4);
      pointer-events: none;
      z-index: 10;
    }
    .hud-title { font-size: 13px; font-weight: bold; letter-spacing: 0.5px; }
    .hud-sub { font-size: 10px; color: #94a3b8; margin-top: 2px; }
  </style>
</head>
<body>
  <div class="hud">
    <div class="hud-title">🌊 GLSL 5: Thermodynamic Quantum Fluid Swarm</div>
    <div class="hud-sub">6-octave FBM with mouse vortex, domain coloring, bloom, ACES tone map.</div>
  </div>
  <canvas id="c"></canvas>
  <script>
    const canvas = document.getElementById('c');
    const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
    gl.getExtension('OES_standard_derivatives');

    const fs = `
precision highp float;
varying vec2 v_texCoord;
uniform float u_time;
uniform vec2 u_resolution;
uniform float u_audio;
uniform vec2 u_mouse;

float hash(vec2 p) {
    return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
}

float noise(vec2 p) {
    vec2 i = floor(p);
    vec2 f = fract(p);
    f = f * f * (3.0 - 2.0 * f);
    return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), f.x),
               mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), f.x), f.y);
}

float fbm(vec2 p) {
    float v = 0.0;
    float a = 0.5;
    for (int i = 0; i < 6; i++) {
        v += a * noise(p);
        p *= 2.01 + float(i) * 0.01;
        a *= 0.5;
    }
    return v;
}

void main() {
    vec2 uv = v_texCoord * 3.5;

    // mouse-driven vortex center
    vec2 m = u_mouse * 3.5;
    vec2 d = uv - m;
    float ang = atan(d.y, d.x);
    float rad = length(d);
    // swirl
    uv += vec2(sin(ang + rad * 3.0 - u_time * 0.5), cos(ang + rad * 3.0 - u_time * 0.5)) * 0.15 / (rad + 0.3);

    vec2 q = vec2(fbm(uv + u_time * 0.1), fbm(uv + vec2(5.2, 1.3) - u_time * 0.15));
    vec2 r = vec2(fbm(uv + 4.0 * q + vec2(1.7, 9.2) + u_time * 0.12),
                   fbm(uv + 4.0 * q + vec2(8.3, 2.8) - u_time * 0.1));
    float f = fbm(uv + 4.0 * r);

    vec3 cyan    = vec3(0.0, 0.94, 1.0);
    vec3 emerald = vec3(0.01, 0.62, 0.49);
    vec3 gold    = vec3(1.0, 0.84, 0.0);
    vec3 deep    = vec3(0.02, 0.04, 0.12);

    vec3 col = mix(deep, cyan, smoothstep(0.2, 0.6, f));
    col = mix(col, emerald, smoothstep(0.4, 0.8, f * f * 2.0));
    col = mix(col, gold, smoothstep(0.7, 1.0, length(q)) * 0.35);

    // domain-coloring swirl accent
    float swirl = atan(r.y, r.x);
    col += vec3(0.3, 0.6, 1.0) * (0.5 + 0.5 * sin(swirl * 3.0 + u_time)) * f * 0.15;

    // vignette
    col *= 1.0 - length(v_texCoord - 0.5) * 0.8;

    // bloom
    float lum = dot(col, vec3(0.299, 0.587, 0.114));
    col += col * smoothstep(0.5, 0.9, lum) * 0.3;

    // film grain
    float grain = hash(v_texCoord * u_resolution + u_time * 100.0) * 0.04 - 0.02;
    col += grain;

    // ACES
    col = (col * (2.51 * col + 0.03)) / (col * (2.43 * col + 0.59) + 0.14);

    gl_FragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
}
`;

    function compile(type, src) {
      const s = gl.createShader(type);
      gl.shaderSource(s, src);
      gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
        console.error('Shader compile error:', gl.getShaderInfoLog(s));
        return null;
      }
      return s;
    }
    const vs = `attribute vec2 p; varying vec2 v_texCoord; void main(){ v_texCoord = p * 0.5 + 0.5; gl_Position = vec4(p, 0.0, 1.0); }`;
    const prog = gl.createProgram();
    const vsh = compile(gl.VERTEX_SHADER, vs);
    const fsh = compile(gl.FRAGMENT_SHADER, fs);
    if (!vsh || !fsh) { console.error('Shader failed to compile'); return; }
    gl.attachShader(prog, vsh);
    gl.attachShader(prog, fsh);
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
      console.error('Program link error:', gl.getProgramInfoLog(prog));
      return;
    }
    gl.useProgram(prog);

    const buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
    const pLoc = gl.getAttribLocation(prog, 'p');
    gl.enableVertexAttribArray(pLoc);
    gl.vertexAttribPointer(pLoc, 2, gl.FLOAT, false, 0, 0);

    const uTime = gl.getUniformLocation(prog, 'u_time');
    const uRes  = gl.getUniformLocation(prog, 'u_resolution');
    const uAudio = gl.getUniformLocation(prog, 'u_audio');
    const uMouse = gl.getUniformLocation(prog, 'u_mouse');

    let mouseX = 0.5, mouseY = 0.5;
    window.addEventListener('mousemove', (e) => {
      mouseX = e.clientX / window.innerWidth;
      mouseY = 1.0 - e.clientY / window.innerHeight;
    });

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width  = Math.floor(window.innerWidth  * dpr);
      canvas.height = Math.floor(window.innerHeight * dpr);
      gl.viewport(0, 0, canvas.width, canvas.height);
    }
    resize();
    window.addEventListener('resize', resize);

    let visible = true;
    document.addEventListener('visibilitychange', () => { visible = !document.hidden; });

    let t0 = performance.now();
    function render(t) {
      requestAnimationFrame(render);
      if (!visible) return;
      if (uTime)   gl.uniform1f(uTime,   (t - t0) * 0.001);
      if (uRes)    gl.uniform2f(uRes,     canvas.width, canvas.height);
      if (uAudio)  gl.uniform1f(uAudio,   0.7);
      if (uMouse)  gl.uniform2f(uMouse,   mouseX, mouseY);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    }
    render(0);
  </script>
</body>
</html>
