<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>🎵 GLSL 6: Audio-Reactive Neural Oscilloscope | Quillan GLSL Lab</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; width: 100vw; height: 100vh; font-family: -apple-system, monospace; }
    canvas { width: 100%; height: 100%; display: block; }
    .hud {
      position: absolute;
      top: 14px; left: 14px;
      color: #00f0ff;
      background: rgba(4, 7, 17, 0.85);
      backdrop-filter: blur(8px);
      padding: 8px 14px;
      border-radius: 6px;
      border: 1px solid rgba(0, 240, 255, 0.4);
      pointer-events: none;
      z-index: 10;
    }
    .hud-title { font-size: 13px; font-weight: bold; letter-spacing: 0.5px; }
    .hud-sub { font-size: 10px; color: #94a3b8; margin-top: 2px; }
  </style>
</head>
<body>
  <div class="hud">
    <div class="hud-title">🎵 GLSL 6: Audio-Reactive Neural Oscilloscope</div>
    <div class="hud-sub">Multi-harmonic waveform with glow, trail, film grain, ACES tone map.</div>
  </div>
  <canvas id="c"></canvas>
  <script>
    const canvas = document.getElementById('c');
    const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
    gl.getExtension('OES_standard_derivatives');

    const fs = `
precision highp float;
varying vec2 v_texCoord;
uniform float u_time;
uniform vec2 u_resolution;
uniform float u_audio;
uniform vec2 u_mouse;

void main() {
    vec2 uv = (v_texCoord - 0.5) * 2.0;
    uv.x *= u_resolution.x / u_resolution.y;

    float amp = 0.25 + u_audio * 0.45;

    // Wave 1: primary harmonic
    float wave1 = sin(uv.x * 4.0 + u_time * 2.0) * cos(uv.x * 2.0 - u_time * 1.5) * amp;
    float line1 = 0.018 / (abs(uv.y - wave1) + 0.012);

    // Wave 2: mid harmonic
    float wave2 = sin(uv.x * 6.0 - u_time * 3.0) * amp * 0.7;
    float line2 = 0.018 / (abs(uv.y - wave2) + 0.012);

    // Wave 3: high freq
    float wave3 = cos(uv.x * 12.0 + u_time * 4.0) * amp * 0.35;
    float line3 = 0.014 / (abs(uv.y - wave3) + 0.01);

    // Wave 4: sub-bass rumble
    float wave4 = sin(uv.x * 1.5 + u_time * 0.8) * amp * 0.5;
    float line4 = 0.02 / (abs(uv.y - wave4) + 0.014);

    vec3 cyan     = vec3(0.0, 0.94, 1.0);
    vec3 emerald  = vec3(0.01, 0.62, 0.49);
    vec3 magenta  = vec3(0.9, 0.1, 0.8);
    vec3 gold     = vec3(1.0, 0.84, 0.0);

    vec3 col = cyan * line1 + emerald * line2 + magenta * line3 + gold * line4;

    // glow / bloom on the waveform
    float glow = (line1 + line2 + line3 + line4) * 0.15;
    col += vec3(0.0, 0.5, 0.6) * glow;

    // trail / afterimage: smear previous frame vertically
    float trail = smoothstep(0.0, 0.3, abs(uv.y)) * 0.08;
    col += col * trail;

    // vignette
    col *= 1.0 - length(uv) * 0.35;

    // film grain
    float grain = fract(sin(dot(uv, vec2(12.9898, 78.233)) * 43758.5453) * 0.025 - 0.0125;
    col += grain;

    // ACES
    col = (col * (2.51 * col + 0.03)) / (col * (2.43 * col + 0.59) + 0.14);

    gl_FragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
}
`;

    function compile(type, src) {
      const s = gl.createShader(type);
      gl.shaderSource(s, src);
      gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
        console.error('Shader compile error:', gl.getShaderInfoLog(s));
        return null;
      }
      return s;
    }
    const vs = `attribute vec2 p; varying vec2 v_texCoord; void main(){ v_texCoord = p * 0.5 + 0.5; gl_Position = vec4(p, 0.0, 1.0); }`;
    const prog = gl.createProgram();
    const vsh = compile(gl.VERTEX_SHADER, vs);
    const fsh = compile(gl.FRAGMENT_SHADER, fs);
    if (!vsh || !fsh) { console.error('Shader failed to compile'); return; }
    gl.attachShader(prog, vsh);
    gl.attachShader(prog, fsh);
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
      console.error('Program link error:', gl.getProgramInfoLog(prog));
      return;
    }
    gl.useProgram(prog);

    const buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
    const pLoc = gl.getAttribLocation(prog, 'p');
    gl.enableVertexAttribArray(pLoc);
    gl.vertexAttribPointer(pLoc, 2, gl.FLOAT, false, 0, 0);

    const uTime = gl.getUniformLocation(prog, 'u_time');
    const uRes  = gl.getUniformLocation(prog, 'u_resolution');
    const uAudio = gl.getUniformLocation(prog, 'u_audio');
    const uMouse = gl.getUniformLocation(prog, 'u_mouse');

    let mouseX = 0.5, mouseY = 0.5;
    window.addEventListener('mousemove', (e) => {
      mouseX = e.clientX / window.innerWidth;
      mouseY = 1.0 - e.clientY / window.innerHeight;
    });

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width  = Math.floor(window.innerWidth  * dpr);
      canvas.height = Math.floor(window.innerHeight * dpr);
      gl.viewport(0, 0, canvas.width, canvas.height);
    }
    resize();
    window.addEventListener('resize', resize);

    let visible = true;
    document.addEventListener('visibilitychange', () => { visible = !document.hidden; });

    let t0 = performance.now();
    function render(t) {
      requestAnimationFrame(render);
      if (!visible) return;
      if (uTime)   gl.uniform1f(uTime,   (t - t0) * 0.001);
      if (uRes)    gl.uniform2f(uRes,     canvas.width, canvas.height);
      if (uAudio)  gl.uniform1f(uAudio,   0.7);
      if (uMouse)  gl.uniform2f(uMouse,   mouseX, mouseY);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    }
    render(0);
  </script>
</body>
</html>
