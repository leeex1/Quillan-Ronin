# 👑 Quillan-Ronin v5.3.1 — Automated Post-Training Evaluation Config
evaluation:
  checkpoint_candidates:
    - "C:/02_QUILLAN/checkpoints/quillan_frontier_v2_best.pt"
    - "C:/02_QUILLAN/checkpoints/quillan_ronin_v531_sovereign_production.pt"
  output_report: "C:/02_QUILLAN/training_logs/terminal_evaluation_report.json"
  markdown_report: "C:/02_QUILLAN/training_logs/terminal_evaluation_report.md"
  
sampling:
  temperatures: [0.2, 0.7, 1.0]
  top_k: 40
  top_p: 0.85
  repetition_penalty: 1.15
  frequency_penalty: 0.50
  presence_penalty: 0.30
  max_new_tokens: 220

benchmarks:
  - id: "formal_logic_socrates"
    domain: "Deductive Logic"
    prompt: "If all humans are mortal and Socrates is human, is Socrates mortal? Provide the formal syllogistic proof."
    expected_keywords: ["Socrates", "mortal", "Premise", "Conclusion", "Barbara"]

  - id: "photosynthesis_biochem"
    domain: "Biochemistry"
    prompt: "Explain the chemical process of photosynthesis in plants, including the balanced chemical equation."
    expected_keywords: ["6CO2", "6H2O", "C6H12O6", "6O2", "chloroplast", "Calvin"]

  - id: "einstein_mass_energy"
    domain: "Relativistic Physics"
    prompt: "State Einstein's mass-energy equivalence equation and explain its physical implications."
    expected_keywords: ["E = mc²", "Joules", "speed of light"]

  - id: "palindrome_python"
    domain: "Algorithm Synthesis"
    prompt: "Write a Python function to check if a string is a palindrome."
    expected_keywords: ["def", "is_palindrome", "return"]

  - id: "raft_consensus"
    domain: "Distributed Systems"
    prompt: "Explain how the Raft consensus algorithm handles leader election and log replication across nodes."
    expected_keywords: ["Raft", "leader", "election", "log", "heartbeat", "quorum"]

  - id: "btree_database"
    domain: "Database Architecture"
    prompt: "Describe how B-Tree indexes work in relational databases and why they are preferred over Hash indexes for range queries."
    expected_keywords: ["B-Tree", "ordered", "range", "logarithmic", "Hash", "index"]
